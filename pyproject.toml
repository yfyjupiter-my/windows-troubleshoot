[project]
name = "app-triage"
version = "0.1.0"
description = "AppTriage: Windows app/autorun/file-association triage tool"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6>=6.7",
    "openai>=1.40",
    "pywin32>=306; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pyinstaller>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
